name: beta-ci

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main", "staging"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Parser regression
        run: npm test -- parser.test

      - name: Lint
        run: npm run lint

      - name: Full test suite (unit, integration, e2e)
        run: npm run test:all

      - name: Export parse fixtures
        run: npx tsx scripts/export-fixtures.ts

      - name: Export E2E output
        run: npm run export:all || echo "export:all failed"

      - name: Inspect DB
        run: npm run inspect:db || echo "inspect:db failed"



      # Centralized job ingestion: use GmailApiAdapter by default for CI volume
      - name: Ingest jobs via GmailApiAdapter (CI default)
        run: npm run data-listening:gmail-api

      # Optionally, for pre-prod, use webhook adapter (long-living, rate-limited)
      # - name: Ingest jobs via GmailWebhookAdapter (pre-prod)
      #   run: npm run data-listening:webhook

      # Metrics and aggregates output
      - name: Aggregate metrics
        run: npm run stats || echo "Skipping: stats aggregation failed"

      - name: Upload Metrics Artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics-report
          path: test-output/continuous-e2e-report.json

      - name: Check Exit Criteria
        run: npm run check:exit-criteria || echo "Exit criteria check failed"

      - name: Tag Release (if exit criteria met)
        if: success()
        run: |
          VERSION=$(node scripts/get-next-version.js)
          git tag $VERSION
          git push origin $VERSION

      - name: Update Documentation
        run: npm run update:docs || echo "Docs update failed"

      - name: Upload parse fixtures
        uses: actions/upload-artifact@v4
        with:
          name: parse-fixtures
          path: tests/__fixtures__/parse-samples.json

      - name: Upload failed parses
        uses: actions/upload-artifact@v4
        with:
          name: failed-parses
          path: tests/__fixtures__/failed-parses.json

      - name: Upload export stats
        uses: actions/upload-artifact@v4
        with:
          name: export-stats
          path: tests/__fixtures__/export-stats.json

      - name: Export E2E output artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: src/db/e2e-output/
