# Systemd tmpfiles configuration for jobs-watcher runtime directories
# 
# Ensures /run/jobs-watcher exists with correct ownership and permissions
# at boot and after /run is cleaned (systemd-tmpfiles runs automatically).
#
# Location: /etc/tmpfiles.d/jobs-watcher.conf
# Apply: systemd-tmpfiles --create /etc/tmpfiles.d/jobs-watcher.conf

# Directory: /run/jobs-watcher
# Mode: 0755 (rwxr-xr-x)
# Owner: jobs-watcher:jobs-watcher
d /run/jobs-watcher 0755 jobs-watcher jobs-watcher

# Placeholder file to ensure directory is tracked
# (some systems clean empty directories from /run)
f /run/jobs-watcher/.gitkeep 0644 jobs-watcher jobs-watcher
